# MedusaHC-Calibrate
#
# This single file contains the user-facing calibration settings and Mainsail
# macro entry points. Start with the common and Eddy Tap blocks. Uncomment the
# contact-sensor pin/coordinates only after verifying them manually.

[medusahc_calibrate]

# ---------------------------------------------------------------------------
# Common MedusaHC integration
# ---------------------------------------------------------------------------
# These defaults work with both classic MedusaHC macros and the experimental
# MedusaHC Python Controller.
set_command: SET
drop_command: DROP
clean_command: CLEAN
offset_command: TOOL_OFFSET_T
tool_state_object: pin_watch io

travel_speed: 250
positioning_speed: 250
transition_speed: 250
final_lift_z: 6
calibration_temperature: 150
verbose: True

# ---------------------------------------------------------------------------
# SexBall-style contact calibration (optional)
# ---------------------------------------------------------------------------
# Uncomment all four lines and replace them with the real, manually verified
# sensor input and safe approximate position. Leaving pin commented disables
# only contact calibration; Eddy methods remain available.
#pin: ^PA1
#probe_x: 0
#probe_y: 0
#probe_z: 15

spread: 7
lower_z: 0.3
speed: 4
z_speed: 6
lift_speed: 4
retract_speed: 150
max_probe_travel: 12
sample_retract_dist: 2
z_sample_retract_dist: 3

# directions is the number of opposing axes. The module probes twice this many
# points around the sensor: 12 directions = 24 circular contact points.
directions: 12
# The first physical contact at every circular point is discarded for settling.
samples: 5
samples_result: median
samples_tolerance: 0.03
samples_tolerance_retries: 10
center_tolerance: 0.03

# ---------------------------------------------------------------------------
# Native Eddy Tap Z calibration
# ---------------------------------------------------------------------------
# tap_x/tap_y must be a verified safe bed position reachable by every tool.
# tap_probe is the Klipper object used by PROBE METHOD=tap.
tap_probe: probe_eddy_current eddy
tap_x: 165
tap_y: 190
tap_samples: 3

# ---------------------------------------------------------------------------
# Eddy Tap Z + stationary EddySeek XY calibration
# ---------------------------------------------------------------------------
# Install and configure EddySeek separately. eddy_seek_z is the machine Z used
# above its stationary coil; it must agree with EddySeek's sensor_z guard.
eddy_seek_z: 5.0
eddy_seek_repeats: 3


# ---------------------------------------------------------------------------
# Commands shown as Mainsail/Fluidd macros
# ---------------------------------------------------------------------------

[gcode_macro CALIBRATE_XYZ_TOUCH]
description: Calibrate XYZ offsets with a SexBall-style contact sensor
gcode:
    MHC_CALIBRATE_ALL

[gcode_macro CALIBRATE_XYZ_EDDY]
description: Calibrate XYZ offsets with Eddy Tap and stationary EddySeek
gcode:
    MHC_CALIBRATE_EDDY_ALL

[gcode_macro CALIBRATE_Z_EDDY]
description: Calibrate Z offsets with native Eddy Tap
gcode:
    MHC_CALIBRATE_TAP_Z

[gcode_macro CALIBRATION_STATUS]
description: Show MedusaHC calibration state and last error
gcode:
    MHC_CALIBRATE_QUERY
